<!doctype html>
<html lang="fr">
	<!-- Static fallback served before any layout: it cannot read the lang cookie, so it carries both languages. -->
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% | Olympic Warriors</title>
		<!-- SvelteKit fills in only the status and error message here, no assets path: the icons use root paths. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<style>
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				min-height: 100vh;
				margin: 0;
				background-color: #000000;
				color: #F9F3C1;
				font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
			}

			h1 {
				font-size: 4rem;
				margin: 0;
				font-family: 'Arial Narrow', Impact, sans-serif;
				letter-spacing: 0.06em;
			}

			a {
				color: #000000;
				background-color: #F9F3C1;
				font-family: 'Arial Narrow', Impact, sans-serif;
				letter-spacing: 0.15em;
				padding: 0.6rem 2rem;
				border-radius: 6px;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<h1>%sveltekit.status%</h1>
		<p>Quelque chose s'est mal passé · <span lang="en">Something went wrong</span></p>
		<a href="/">Retour aux Olympic Warriors · <span lang="en">Back to the Olympic Warriors</span></a>
	</body>
</html>
