version: "3"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    # Badges are rebuilt monthly by a crontab entry on the host (see CLAUDE.md, "Player badges"),
    # logging under the crontab user's home (mkdir ~/logs once; /var/log needs root):
    # 0 2 1 * * cd <repo> && docker compose -f <this file> exec -T server python manage.py refresh_badges >> $HOME/logs/olympic-warriors-badges.log 2>&1
    command: gunicorn olympic_warriors.wsgi:application --bind 0.0.0.0:3003
    # Loopback only: the login throttle trusts the last X-Forwarded-For entry (NUM_PROXIES=1),
    # so a client reaching Django without nginx or the front could name any IP. nginx reaches
    # it as server:3003 on the compose network, and must set X-Forwarded-For on that location
    # too (proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;), or the header is the
    # client's own. The same holds for every app port below.
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./server/:/server
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    working_dir: /home/app/web/
    environment:
      - ENV=prod
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    user: postgres
    environment:
      - POSTGRES_DB=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - PGPORT=
    ports:
      - 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U POSTGRES_USER -d POSTGRES_DB"]
      interval: 10s
      timeout: 60s
      retries: 20
      start_period: 20s
    volumes:
      - data:/var/lib/postgresql/data

  server-stage:
    build:
      context: /opt/OW_stage/Olympic-Warriors/server
      dockerfile: Dockerfile.stage
    command: gunicorn olympic_warriors.wsgi:application --bind 0.0.0.0:3004
    ports:
      - "127.0.0.1:3004:3004"
    volumes:
      - /opt/OW_stage/Olympic-Warriors/server/:/home/stage/web/
      - static_volume_stage:/home/stage/web/staticfiles
      - media_volume_stage:/home/stage/web/mediafiles
    working_dir: /home/stage/web/
    environment:
      - ENV=prod
    depends_on:
      db-stage:
        condition: service_healthy

  db-stage:
    image: postgres:16-alpine
    restart: always
    user: postgres
    environment:
      - POSTGRES_DB=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - PGPORT=
    ports:
      - 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U POSTGRES_USER -d POSTGRES_DB"]
      interval: 10s
      timeout: 60s
      retries: 20
      start_period: 20s
    volumes:
      - data_stage:/var/lib/postgresql/data

  front-stage:
    image: front
    build:
      context: ./front
      dockerfile: Dockerfile.stage
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=PRODUCTION
      # As on front below.
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    volumes:
      - ./front/:/usr/src/app
      - /usr/src/app/node_modules

  front:
    image: front
    build:
      context: ./front
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=PRODUCTION
      # Public origin of the site: SvelteKit refuses form POSTs (the language switch) whose Origin differs.
      - ORIGIN=https://olympicwarriors.com
      # Visitor IP for getClientAddress(), which the login forwards to the API's throttle; without it
      # every login shares nginx's bucket. Only with nginx setting X-Forwarded-For on this location
      # (proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;), or visitors can forge it.
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    volumes:
      - ./front/:/usr/src/app
      - /usr/src/app/node_modules

  nginx:
    image: jonasal/nginx-certbot:5.2.1-alpine
    restart: unless-stopped
    environment:
      - CERTBOT_EMAIL=
    ports:
      - "80:80"
      - "443:443"
    volumes:                                          # Lets Encrypt certs storage can be either a
      - nginx_secrets:/etc/letsencrypt                # Docker managed volume (see list at the bottom)
      - ./nginx/user_conf.d:/etc/nginx/user_conf.d    # or a host mount with a relative or full path.
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
      - static_volume_stage:/home/stage/web/staticfiles
      - media_volume_stage:/home/stage/web/mediafiles
    depends_on:
      - server
      - server-stage


volumes:
  data:
  static_volume:
  media_volume:
  nginx_secrets:
  data_stage:
  static_volume_stage:
  media_volume_stage:
